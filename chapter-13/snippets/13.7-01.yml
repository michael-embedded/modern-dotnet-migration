# Modern .NET, Chapter 13, Section 13.7
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopservice
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: shopservice
  template:
    metadata:
      labels:
        app: shopservice
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: shopservice
          image: ghcr.io/your-org/your-repo/shopservice:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: Shop__Name
              value: "Production Shop"
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { memory: "512Mi" }
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
